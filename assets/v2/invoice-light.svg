<svg xmlns="http://www.w3.org/2000/svg" width="520" height="586" viewBox="0 0 520 586" role="img" aria-labelledby="title"><title id="title">Invoice automation with validation, human review, ERP posting, and outcome verification.</title><defs></defs><style>text{font-family:Arial,Helvetica,sans-serif}.flow{stroke-dasharray:5 12;animation:travel 10s linear infinite}@keyframes travel{to{stroke-dashoffset:-170}}@media(prefers-reduced-motion:reduce){.flow{animation:none}}</style><rect x="1" y="1" width="518" height="584" rx="16" fill="#f5f9fc" stroke="#ccdae4"/><text x="24" y="35" font-size="12" fill="#087c72" font-weight="600" text-anchor="start">INVOICE / PROCESS OVERVIEW</text><rect x="24" y="56" width="294" height="64" rx="10" fill="#fff" stroke="#ccdae4"/><text x="42" y="82" font-size="17" fill="#183249" font-weight="600" text-anchor="start">Upload document</text><text x="42" y="104" font-size="12" fill="#526a7d" font-weight="400" text-anchor="start">Preserve the original file</text><rect x="24" y="144" width="294" height="64" rx="10" fill="#fff" stroke="#ccdae4"/><text x="42" y="170" font-size="17" fill="#183249" font-weight="600" text-anchor="start">Classify &amp; extract</text><text x="42" y="192" font-size="12" fill="#526a7d" font-weight="400" text-anchor="start">Identify the path and read fields</text><rect x="24" y="232" width="294" height="64" rx="10" fill="#fff" stroke="#ccdae4"/><text x="42" y="258" font-size="17" fill="#183249" font-weight="600" text-anchor="start">Validate &amp; route</text><text x="42" y="280" font-size="12" fill="#526a7d" font-weight="400" text-anchor="start">Check required data and duplicates</text><rect x="24" y="362" width="294" height="64" rx="10" fill="#fff" stroke="#ccdae4"/><text x="42" y="388" font-size="17" fill="#183249" font-weight="600" text-anchor="start">Post to Daftra</text><text x="42" y="410" font-size="12" fill="#526a7d" font-weight="400" text-anchor="start">Create the record and attach the file</text><rect x="24" y="450" width="294" height="64" rx="10" fill="#fff" stroke="#ccdae4"/><text x="42" y="476" font-size="17" fill="#183249" font-weight="600" text-anchor="start">Verify &amp; record status</text><text x="42" y="498" font-size="12" fill="#526a7d" font-weight="400" text-anchor="start">Check the saved result</text><path d="M171 121 v18 m-4 -5 l4 5 l4 -5" fill="none" stroke="#087c72" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" /><path d="M171 209 v18 m-4 -5 l4 5 l4 -5" fill="none" stroke="#087c72" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" /><path d="M171 296 V356" fill="none" stroke="#087c72" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" /><path d="M167 351 L171 356 L175 351" fill="none" stroke="#087c72" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" /><text x="182" y="328" font-size="12" fill="#526a7d" font-weight="400" text-anchor="start">ready</text><rect x="344" y="228" width="152" height="82" rx="10" fill="#fff" stroke="#ccdae4"/><text x="360" y="255" font-size="15" fill="#183249" font-weight="600" text-anchor="start">Human review</text><text x="360" y="278" font-size="12" fill="#526a7d" font-weight="400" text-anchor="start">Resolve missing</text><text x="360" y="297" font-size="12" fill="#526a7d" font-weight="400" text-anchor="start">or unclear details</text><path d="M318 263 H339" fill="none" stroke="#087c72" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" /><path d="M334 259 L339 263 L334 267" fill="none" stroke="#087c72" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" /><path d="M171 427 v18 m-4 -5 l4 5 l4 -5" fill="none" stroke="#087c72" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" /><rect x="344" y="444" width="152" height="76" rx="10" fill="#fff" stroke="#ccdae4"/><text x="360" y="472" font-size="15" fill="#183249" font-weight="600" text-anchor="start">Reconciliation</text><text x="360" y="497" font-size="12" fill="#526a7d" font-weight="400" text-anchor="start">Uncertain save</text><path d="M318 482 H339" fill="none" stroke="#087c72" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" /><path d="M334 478 L339 482 L334 486" fill="none" stroke="#087c72" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" /><text x="24" y="557" font-size="13" fill="#526a7d" font-weight="400" text-anchor="start">AI extracts. Validation and review control the next step.</text></svg>
