<svg xmlns="http://www.w3.org/2000/svg" width="1040" height="274" viewBox="0 0 1040 274" role="img" aria-labelledby="title"><title id="title">Make data useful. Make work flow. Analytics and automation by Mostafa Mohamed.</title><defs><linearGradient id="bg" x2="1" y2="1"><stop stop-color="#0c1628"/><stop offset=".55" stop-color="#102940"/><stop offset="1" stop-color="#123c42"/></linearGradient><linearGradient id="line"><stop stop-color="#459fff"/><stop offset="1" stop-color="#68e4c3"/></linearGradient><pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse"><path d="M32 0H0V32" fill="none" stroke="#6ad3da" stroke-opacity=".055"/></pattern></defs><style>text{font-family:Arial,Helvetica,sans-serif}.flow{stroke-dasharray:5 12;animation:travel 10s linear infinite}@keyframes travel{to{stroke-dashoffset:-170}}@media(prefers-reduced-motion:reduce){.flow{animation:none}}</style><rect x="0" y="0" width="1040" height="274" rx="20" fill="url(#bg)" stroke="none"/><rect x="0" y="0" width="1040" height="274" rx="20" fill="url(#grid)" stroke="none"/><text x="32" y="40" font-size="12" fill="#7adecf" font-weight="600" text-anchor="start">ANALYTICS / AUTOMATION</text><text x="32" y="96" font-size="43" fill="#eff6ff" font-weight="700" text-anchor="start">Make data useful.</text><text x="32" y="141" font-size="43" fill="#77e1cd" font-weight="700" text-anchor="start">Make work flow.</text><text x="33" y="180" font-size="18" fill="#bacbdf" font-weight="400" text-anchor="start">Business questions → connected systems</text><rect x="570" y="37" width="435" height="182" rx="14" fill="#0a1727" stroke="#2c4b5d"/><text x="592" y="65" font-size="11" fill="#9bb2c8" font-weight="600" text-anchor="start">WORKFLOW / DESIGN</text><path d="M590 80 H985" fill="none" stroke="#233c50" stroke-width="1" stroke-linecap="round" stroke-linejoin="round" /><text x="592" y="107" font-size="15" fill="#68dbcd" font-weight="600" text-anchor="start">source</text><text x="677" y="107" font-size="15" fill="#d1dfef" font-weight="400" text-anchor="start">files · email · database</text><text x="592" y="135" font-size="15" fill="#68dbcd" font-weight="600" text-anchor="start">prepare</text><text x="677" y="135" font-size="15" fill="#d1dfef" font-weight="400" text-anchor="start">clean → validate → model</text><path d="M606 153 V188 H716 M606 164 H716" fill="none" stroke="#3c7d8b" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" /><text x="729" y="169" font-size="15" fill="#8bbaff" font-weight="400" text-anchor="start">Power BI / insights</text><text x="729" y="196" font-size="15" fill="#70dfc6" font-weight="400" text-anchor="start">n8n / automated actions</text><path d="M-20 262 C100 210 220 283 360 247 S620 222 1055 253" fill="none" stroke="url(#line)" stroke-width="2" opacity=".55" class="flow"/></svg>
