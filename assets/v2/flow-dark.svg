<svg xmlns="http://www.w3.org/2000/svg" width="1040" height="230" viewBox="0 0 1040 230" role="img" aria-labelledby="title"><title id="title">Illustrative approach: sources, preparation, modeling, analysis, automation, business action.</title><defs></defs><style>text{font-family:Arial,Helvetica,sans-serif}.flow{stroke-dasharray:5 12;animation:travel 10s linear infinite}@keyframes travel{to{stroke-dashoffset:-170}}@media(prefers-reduced-motion:reduce){.flow{animation:none}}</style><rect x="1" y="1" width="1038" height="228" rx="16" fill="#0d1b29" stroke="#294657"/><text x="26" y="35" font-size="12" fill="#71dac9" font-weight="700" text-anchor="start">FROM INPUT TO IMPACT</text><text x="26" y="65" font-size="20" fill="#eef4fc" font-weight="600" text-anchor="start">The whole flow, when the project needs it.</text><circle cx="80" cy="120" r="21" fill="#142e3b" stroke="#294657"/><text x="80" y="125" font-size="13" fill="#71dac9" font-weight="600" text-anchor="middle">01</text><text x="80" y="168" font-size="18" fill="#eef4fc" font-weight="600" text-anchor="middle">Sources</text><text x="80" y="190" font-size="12" fill="#a8bed1" font-weight="400" text-anchor="middle">Files · email · systems</text><path d="M114 120 h24 m-5 -4 l5 4 l-5 4" fill="none" stroke="#71dac9" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" /><circle cx="256" cy="120" r="21" fill="#142e3b" stroke="#294657"/><text x="256" y="125" font-size="13" fill="#71dac9" font-weight="600" text-anchor="middle">02</text><text x="256" y="168" font-size="18" fill="#eef4fc" font-weight="600" text-anchor="middle">Prepare</text><text x="256" y="190" font-size="12" fill="#a8bed1" font-weight="400" text-anchor="middle">Clean · validate</text><path d="M290 120 h24 m-5 -4 l5 4 l-5 4" fill="none" stroke="#71dac9" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" /><circle cx="432" cy="120" r="21" fill="#142e3b" stroke="#294657"/><text x="432" y="125" font-size="13" fill="#71dac9" font-weight="600" text-anchor="middle">03</text><text x="432" y="168" font-size="18" fill="#eef4fc" font-weight="600" text-anchor="middle">Model</text><text x="432" y="190" font-size="12" fill="#a8bed1" font-weight="400" text-anchor="middle">Database · relationships</text><path d="M466 120 h24 m-5 -4 l5 4 l-5 4" fill="none" stroke="#71dac9" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" /><circle cx="608" cy="120" r="21" fill="#142e3b" stroke="#294657"/><text x="608" y="125" font-size="13" fill="#71dac9" font-weight="600" text-anchor="middle">04</text><text x="608" y="168" font-size="18" fill="#eef4fc" font-weight="600" text-anchor="middle">Analyze</text><text x="608" y="190" font-size="12" fill="#a8bed1" font-weight="400" text-anchor="middle">Power BI · DAX</text><path d="M642 120 h24 m-5 -4 l5 4 l-5 4" fill="none" stroke="#71dac9" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" /><circle cx="784" cy="120" r="21" fill="#142e3b" stroke="#294657"/><text x="784" y="125" font-size="13" fill="#71dac9" font-weight="600" text-anchor="middle">05</text><text x="784" y="168" font-size="18" fill="#eef4fc" font-weight="600" text-anchor="middle">Automate</text><text x="784" y="190" font-size="12" fill="#a8bed1" font-weight="400" text-anchor="middle">n8n · workflows</text><path d="M818 120 h24 m-5 -4 l5 4 l-5 4" fill="none" stroke="#71dac9" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" /><circle cx="960" cy="120" r="21" fill="#142e3b" stroke="#294657"/><text x="960" y="125" font-size="13" fill="#71dac9" font-weight="600" text-anchor="middle">06</text><text x="960" y="168" font-size="18" fill="#eef4fc" font-weight="600" text-anchor="middle">Act</text><text x="960" y="190" font-size="12" fill="#a8bed1" font-weight="400" text-anchor="middle">Alerts · follow-up</text></svg>
