<style>.a{animation:cycle 12s infinite}.b{animation:cycle 12s -8s infinite}.c{animation:cycle 12s -4s infinite}.rise{transform-origin:center bottom;animation:rise 3s ease-in-out infinite alternate}.blink{animation:blink 1s steps(1) infinite}@keyframes cycle{0%,28%{opacity:1}33%,95%{opacity:0}100%{opacity:1}}@keyframes rise{from{transform:scaleY(.75)}to{transform:scaleY(1)}}@keyframes blink{50%{opacity:0}}@media(prefers-reduced-motion:reduce){*{animation:none!important}.b,.c{opacity:0}.a{opacity:1}}</style>
